<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Route Map Error</title>
  <style>
    :root { --bg: #f5f7fa; --fg: #1f2933; --muted: #52606d; --card: #fff; --border: #d9e2ec; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111418; --fg: #e4e7eb; --muted: #9aa5b1; --card: #1b2026; --border: #3e4c59; }
    }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg);
           color: var(--fg); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { background: var(--card); border: 1px solid var(--border); border-radius: 10px;
           padding: 24px 28px; margin: 16px; max-width: 560px; }
    h1 { font-size: 18px; margin: 0 0 8px; }
    code { color: var(--muted); }
    pre { background: var(--bg); padding: 10px; border-radius: 6px; overflow: auto; font-size: 13px; }
  </style>
</head>
<body>
  <main>
    <h1>Could not build the route map</h1>
    <p>{{ error.message }}</p>
    <p><code>{{ status_code }} · {{ error.code }}</code></p>
    {% if error.details %}<pre>{{ error.details|pprint }}</pre>{% endif %}
  </main>
</body>
</html>
